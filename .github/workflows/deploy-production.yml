# TEMPLATE — wire when deploy target is chosen (spec §7)
#
# Production deploy orchestrator — builds once, then calls deploy-gcp.yml
# (or deploy-local.yml as fallback) as a reusable workflow.
# Triggers ONLY via manual dispatch (workflow_dispatch).
#
# To activate: choose a deploy target (spec §7), restore the push-to-main
# trigger below. deploy-gcp.yml already declares workflow_call.

name: Deploy Production (Template)

# Dispatch-only until deploy target is chosen.
on:
  workflow_dispatch:
  # push:           # Remove comment and configure when deploy target chosen
  #   branches:
  #     - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  # ============================================
  # Build all apps with production config.
  # Artifacts are shared with the deploy jobs via
  # the same github.run_id (reusable workflow context).
  # ============================================
  build:
    name: Build (Standalone Production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      app_version: ${{ steps.app_version.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/*/.next/cache
          key: ${{ runner.os }}-nextjs-prod-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-prod-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-prod-

      - name: Compute app version
        id: app_version
        run: |
          VERSION=$(git log -1 --pretty=%s | grep -oP 'v\d{4}\.\d{2}\.\d{2}\.\d+' || true)
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_SHA:0:7}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Build all apps (standalone, production)
        run: pnpm run build
        env:
          CI: "true"
          TARGET_ENV: prod
          STANDALONE: "true"
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.app_version.outputs.value }}

      - name: Ensure artifact directories are non-empty
        # actions/upload-artifact@v4 uses ZIP format which silently drops empty
        # directories. A placeholder file ensures the dir survives ZIP round-trip.
        run: |
          for app in web api worker bot; do
            mkdir -p "apps/$app/.next/static"
            touch "apps/$app/.next/static/.artifact-placeholder"
            mkdir -p "apps/$app/public"
            touch "apps/$app/public/.artifact-placeholder"
          done

      - name: Upload web build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-web
          path: apps/web/.next/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  # ============================================
  # Deploy to GCP (primary production target).
  # deploy-gcp.yml declares workflow_call — no changes needed there.
  # deploy-local.yml is kept as a manual fallback.
  # ============================================
  deploy-gcp:
    name: Deploy to GCP
    needs: build
    uses: ./.github/workflows/deploy-gcp.yml
    secrets: inherit

  # ============================================
  # Alert Telegram when any job fails
  # ============================================
  notify-failure:
    name: Notify Deploy Failure
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [build, deploy-gcp]
    if: ${{ always() && (needs.build.result == 'failure' || needs['deploy-gcp'].result == 'failure') }}
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CRITICAL_THREAD_ID: ${{ secrets.TELEGRAM_CRITICAL_THREAD_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          SERVER_HOSTNAME: "github.com/${{ github.repository }}"
        run: |
          python3 - <<'EOF'
          import html, json, os, urllib.error, urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit("Missing required secret: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID")

          sha = os.environ["COMMIT_SHA"][:7]
          source = os.environ.get("SERVER_HOSTNAME", "github-actions")
          text = (
              "🚨 <b>Production Deploy Failed</b>\n\n"
              f"Commit: <code>{sha}</code>\n"
              f"Triggered by: {html.escape(os.environ['ACTOR'])}\n\n"
              f"🔗 {html.escape(os.environ['RUN_URL'])}\n\n"
              f"\U0001F4CD {source}"
          )

          payload = {
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
          }
          thread_id = os.environ.get("TELEGRAM_CRITICAL_THREAD_ID", "").strip()
          if thread_id:
              try:
                  payload["message_thread_id"] = int(thread_id)
              except ValueError:
                  print(f"Warning: invalid TELEGRAM_CRITICAL_THREAD_ID={thread_id!r}, sending without thread")

          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Alert sent: {resp.read().decode('utf-8', errors='replace')}")
          except urllib.error.HTTPError as e:
              print(f"Telegram API error {e.code}: {e.read().decode('utf-8', errors='replace')}")
              raise
          except urllib.error.URLError as e:
              print(f"Network error reaching Telegram: {e.reason}")
              raise
          EOF
