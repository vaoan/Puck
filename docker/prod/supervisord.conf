# stdout_logfile_maxbytes=0
# stderr_logfile=/dev/stderr
# stderr_logfile_maxbytes=0

# ── apps/bot — Telegram consumer bot (Node long-running service) ──────────────
# fill per app when it lands:
# [program:bot]
# command=node /app/bot/index.js
# directory=/app/bot
# user=puck
# autostart=true
# autorestart=true
# startretries=5
