# =============================================================================
# Puck — supervisord configuration
#
# Runtime shape:
#   - apps/web    → Next.js standalone server (port 5000, served via nginx)
#   - apps/api    → Fastify API server (port 5001, long-running Node service)
#   - apps/worker → Notification worker (long-running Node service)
#   - apps/bot    → Telegram consumer bot (long-running Node service)
#   - nginx       → Reverse proxy for apps/web (port 8080, waits for web)
#   - watcher     → In-process health + resource monitor
#   - warmer      → Warm-up loop to prevent cold starts
#   - boot-reporter → One-shot Telegram progress reporter on container start
#
# Fill per app when it lands — uncomment and adjust the program blocks below.
# =============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
user=puck

# ── nginx — starts immediately; no apps present yet ──────────────────────────
# fill per app when it lands — restore `until nc -z 127.0.0.1 5000; do sleep 1; done &&`
# before `exec /usr/sbin/nginx` once apps/web serves port 5000:
[program:nginx]
command=/bin/sh -c 'until nc -z 127.0.0.1 5000; do sleep 1; done && exec /usr/sbin/nginx -g "daemon off;"'
user=puck
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── apps/web — Next.js standalone server ─────────────────────────────────────
[program:web]
command=node /app/web/apps/web/server.js
directory=/app/web
user=puck
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=30
environment=PORT="5000",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── apps/api — Fastify API (Node long-running service) ───────────────────────
# fill per app when it lands:
# [program:api]
