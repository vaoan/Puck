user puck;
worker_processes auto;
pid /var/run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Only allow websocket upgrades (prevents h2c smuggling)
    map $http_upgrade $allowed_upgrade {
        default "";
        "websocket" "websocket";
    }

    map $http_upgrade $connection_upgrade {
        default "";
        "websocket" "upgrade";
    }

    # Forward the upstream proxy's protocol; fall back to nginx's own $scheme
    # when running without an upstream proxy (e.g. local Docker).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Increase proxy buffer sizes to handle large Set-Cookie headers
    # (raw JSON session cookies from Supabase SSR can exceed the 4KB default)
    proxy_buffer_size          16k;
    proxy_buffers              8 16k;
    proxy_busy_buffers_size    32k;

    # Increase client header buffers to handle large Cookie request headers
    large_client_header_buffers 8 32k;

    # Proxy timeouts — set explicitly so nginx fails fast before
    # any upstream reverse proxy / CDN timeout fires.
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    90s;

    # Retry the request on the same upstream if the connection fails (e.g. the
    # Node.js process just restarted under supervisord). http_502 is included
    # because nginx returns 502 when it can't connect to the upstream.
    proxy_next_upstream         error timeout http_502 http_503;
    proxy_next_upstream_tries   2;
    proxy_next_upstream_timeout 8s;

    # ── Upstreams — fill per app when it lands ────────────────────────────────
    #
    # apps/web — Next.js web app (port 5000)
    upstream web_app {
        server 127.0.0.1:5000;
        keepalive 16;
    }
    #
    # Note: apps/api, apps/worker, apps/bot are Node long-running services
    # and are NOT proxied through nginx — they bind their own ports and are
    # accessed directly or via an external load balancer / API gateway.

    server {
        listen 8080;
        server_name _;

        # Security headers — applied globally to all responses.
        add_header X-Content-Type-Options    "nosniff"          always;
        add_header X-Frame-Options           "SAMEORIGIN"       always;
        add_header X-XSS-Protection          "1; mode=block"    always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

        # ── app routes — fill per app when it lands ───────────────────────────
        #
        # apps/web — all routes rooted at /
        location / {
            proxy_pass http://web_app;
            proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_set_header Upgrade $allowed_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check endpoint (exact match)
        # Use default_type instead of add_header so the server-level security
        # headers are inherited (nginx drops parent add_header when a location
        # defines its own add_header directives).
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }
    }
}
