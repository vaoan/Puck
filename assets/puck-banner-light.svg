<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Puck — event-following and notification platform">
  <defs>
    <radialGradient id="sky" cx="78%" cy="28%" r="95%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EAF6F4"/>
      <stop offset="1" stop-color="#DCEFEC"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="34%" r="74%">
      <stop offset="0" stop-color="#BCEAE3"/>
      <stop offset="0.5" stop-color="#67BDB5"/>
      <stop offset="1" stop-color="#2C7B76"/>
    </radialGradient>
    <linearGradient id="term" x1="0" y1="0" x2="1" y2="0.55">
      <stop offset="0.35" stop-color="#0C3B38" stop-opacity="0"/>
      <stop offset="1" stop-color="#0C3B38" stop-opacity="0.38"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE9BC"/>
      <stop offset="0.55" stop-color="#EE9F2E"/>
      <stop offset="1" stop-color="#D8851A"/>
    </radialGradient>
    <linearGradient id="tail" x1="660" y1="70" x2="576" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EE9F2E" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#EE9F2E" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="planetClip"><circle cx="1000" cy="158" r="96"/></clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#sky)"/>

  <!-- faint orbital path -->
  <ellipse cx="560" cy="182" rx="560" ry="150" transform="rotate(-10 560 182)"
           fill="none" stroke="#2E837C" stroke-opacity="0.22" stroke-width="1.4" stroke-dasharray="1.5 8"/>

  <!-- Uranus: rings are vertical because the planet is tipped on its side -->
  <g transform="rotate(-16 1000 158)">
    <ellipse cx="1000" cy="158" rx="34" ry="168" fill="none" stroke="#2E837C" stroke-opacity="0.3" stroke-width="2"/>
    <ellipse cx="1000" cy="158" rx="22" ry="150" fill="none" stroke="#2E837C" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>

  <circle cx="1000" cy="158" r="96" fill="url(#planet)"/>
  <circle cx="1000" cy="158" r="96" fill="url(#term)" clip-path="url(#planetClip)"/>
  <circle cx="1000" cy="158" r="96" fill="none" stroke="#2C7B76" stroke-opacity="0.25" stroke-width="1"/>

  <g clip-path="url(#planetClip)">
    <g transform="rotate(-16 1000 158)">
      <ellipse cx="1000" cy="158" rx="34" ry="168" fill="none" stroke="#E9FBF7" stroke-opacity="0.85" stroke-width="2"/>
      <ellipse cx="1000" cy="158" rx="22" ry="150" fill="none" stroke="#E9FBF7" stroke-opacity="0.5" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Puck: a single warm spark streaking toward the planet = the alert -->
  <line x1="660" y1="70" x2="576" y2="44" stroke="url(#tail)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="660" cy="70" r="15" fill="url(#spark)" opacity="0.45" filter="url(#glow)"/>
  <circle cx="660" cy="70" r="5.5" fill="url(#spark)"/>
  <circle cx="660" cy="70" r="1.8" fill="#FFF3D8"/>

  <!-- wordmark -->
  <text x="88" y="106" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="600" letter-spacing="4.5" fill="#2E837C">FAST · IDEMPOTENT · FAIL-SAFE</text>
  <text x="84" y="196" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="800" letter-spacing="8" fill="#0E2E30">PUCK</text>
  <text x="90" y="234" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="500" letter-spacing="0.2" fill="#3C6E6B">Follow events. Get the ping that matters.</text>
</svg>
